apiVersion: apps/v1
kind: Deployment
metadata:
  name: todo-tracker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: todo-tracker
  template:
    metadata:
      labels:
        app: todo-tracker
    spec:
      imagePullSecrets:
        - name: acr-pull
      containers:
        - name: todo-tracker
          image: expensereghash123.azurecr.io/todo-tracker:latest
          ports:
            - containerPort: 8080
          env:
            - name: JAVA_TOOL_OPTIONS
              value: "-Xmx256m"
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 5
