spring.application.name=todo-tracker
server.port=8080

# Shown on the page. Change app.title later to demonstrate redeployment.
app.title=Task Tracker
# The pipeline will inject the commit SHA here later
app.version=${APP_VERSION:dev}

spring.datasource.url=jdbc:h2:mem:tododb
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true