- name: Deploy Todo Tracker to k3s
  hosts: all
  gather_facts: false
  vars:
    image: expensereghash123.azurecr.io/todo-tracker:latest
    k8s_dir: "{{ playbook_dir }}/../k8s"
  tasks:
    - name: Apply Kubernetes manifests
      ansible.builtin.command: kubectl apply -f {{ k8s_dir }}
      register: applied
      changed_when: "'created' in applied.stdout or 'configured' in applied.stdout"

    - name: Roll out the new image
      ansible.builtin.command: kubectl set image deployment/todo-tracker todo-tracker={{ image }}

    - name: Show the build tag in the app footer
      ansible.builtin.command: kubectl set env deployment/todo-tracker APP_VERSION={{ image.split(':')[-1] }}

    - name: Wait for rollout to finish
      ansible.builtin.command: kubectl rollout status deployment/todo-tracker --timeout=180s
      changed_when: false
